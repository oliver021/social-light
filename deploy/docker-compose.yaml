    entrypoint:
    - dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      IDENTITY_API_HTTP: http://identity-api:${IDENTITY_API_PORT:-8080}
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: /connect/{**catch-all}
      REVERSEPROXY__ROUTES__route0__CLUSTERID: cluster_identity-api
      REVERSEPROXY__ROUTES__route1__MATCH__PATH: /api/account/{**catch-all}
      REVERSEPROXY__ROUTES__route1__CLUSTERID: cluster_identity-api
      REVERSEPROXY__ROUTES__route2__MATCH__PATH: /api/profiles/{**catch-all}
