name: sociallight-demo
services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    command:
    - postgres
    - -c
    - max_connections=300
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
    - '5432'
    networks:
    - aspire
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
    - pgdata:/var/lib/postgresql/data
  eventbus:
    image: docker.io/library/rabbitmq:4.2
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${EVENTBUS_PASSWORD}
    expose:
    - '5672'
    networks:
    - aspire
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
  identity-api:
    image: ${IDENTITY_API_IMAGE}
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      HTTP_PORTS: ${IDENTITY_API_PORT:-8080}
      ConnectionStrings__identitydb: Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=identitydb
      IDENTITYDB_HOST: postgres
      IDENTITYDB_PORT: '5432'
      IDENTITYDB_USERNAME: postgres
      IDENTITYDB_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITYDB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identitydb
      IDENTITYDB_JDBCCONNECTIONSTRING: jdbc:postgresql://postgres:5432/identitydb
      IDENTITYDB_DATABASENAME: identitydb
      ConnectionStrings__eventbus: amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672
      EVENTBUS_HOST: eventbus
      EVENTBUS_PORT: '5672'
      EVENTBUS_USERNAME: guest
      EVENTBUS_PASSWORD: ${EVENTBUS_PASSWORD}
      EVENTBUS_URI: amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672
      AdminPortalClient: http://admin-portal:${ADMIN_PORTAL_PORT:-8080}
    depends_on:
      eventbus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
    - aspire
    restart: unless-stopped
  profile-api:
    image: ${PROFILE_API_IMAGE}
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      HTTP_PORTS: ${PROFILE_API_PORT:-8080}
      ConnectionStrings__eventbus: amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672
      EVENTBUS_HOST: eventbus
      EVENTBUS_PORT: '5672'
      EVENTBUS_USERNAME: guest
      EVENTBUS_PASSWORD: ${EVENTBUS_PASSWORD}
      EVENTBUS_URI: amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672
      ConnectionStrings__profiledb: Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=profiledb
      PROFILEDB_HOST: postgres
      PROFILEDB_PORT: '5432'
      PROFILEDB_USERNAME: postgres
      PROFILEDB_PASSWORD: ${POSTGRES_PASSWORD}
      PROFILEDB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/profiledb
      PROFILEDB_JDBCCONNECTIONSTRING: jdbc:postgresql://postgres:5432/profiledb
      PROFILEDB_DATABASENAME: profiledb
      Identity__Url: http://identity-api:${IDENTITY_API_PORT:-8080}
      Identity__Audience: socialapi
      Identity__Scopes__socialapi: socialLight API
    expose:
    - ${PROFILE_API_PORT:-8080}
    depends_on:
      eventbus:
        condition: service_healthy
      identity-api:
        condition: service_started
      postgres:
        condition: service_healthy
