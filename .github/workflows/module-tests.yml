name: Generated Module Tests

# Builds and tests the generated social modules (SocialLight.Modules.slnf), then
# publishes a test-report summary. code-engine itself is a coding-time tool and is
# deliberately NOT part of CI: it runs on a developer machine and its output is
# committed, so CI validates the committed output. The module functional tests are
# Aspire + Testcontainers integration tests, so they need Docker (ubuntu-latest
# ships it).

on:
  pull_request:
    paths:
      - 'src/Modules/**'
      - 'src/SocialLight.AppHost/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'SocialLight.Modules.slnf'
      - '.github/workflows/module-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/Modules/**'
      - '.github/workflows/module-tests.yml'

# Required for the test-report action to publish a check run + PR annotations.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4

      # --- generated modules: build, then run the Aspire/Postgres functional tests ---
      - name: Build modules
        run: dotnet build SocialLight.Modules.slnf

      - name: Test modules (TRX report per project)
        run: >-
          dotnet test --solution SocialLight.Modules.slnf --no-build --no-progress
          --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results

      # --- single, showable report: TRX per test project -> PR summary ---
      - name: Publish test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Module tests
          comment_mode: always
          files: |
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/*.xml

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn
